<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Responsive Chat App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <!-- Emoji Picker -->
    <script type="module" src="https://cdn.jsdelivr.net/npm/emoji-picker-element@1.0.3/index.js"></script>

    <!-- Socket.io -->
    <script src="/socket.io/socket.io.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="h-screen bg-slate-100 overflow-hidden">

    <div class="flex h-full">

        <!-- CHAT SECTION -->
        <div class="flex flex-col flex-1">

            <!-- HEADER -->
            <div class="flex items-center justify-between px-4 py-3 bg-emerald-600 text-white shadow">

                <div class="flex items-center gap-3">
                    <!-- MOBILE MENU -->
                    <button id="menuBtn" class="md:hidden text-xl focus:outline-none">
                        <i class="fa-solid fa-bars"></i>
                    </button>

                    <h1 class="text-lg font-semibold">Chat Application</h1>
                </div>

                <img src="./download.png" class="w-9 h-9 rounded bg-white p-1" />
            </div>

            <!-- CHAT BOX -->
            <div id="chatbox" class="flex-1 overflow-y-auto p-4 space-y-3 bg-slate-50">
            </div>

            <!-- INPUT BAR -->
            <div class="relative flex items-center gap-2 p-2 border-t bg-white">

                <!-- ATTACH -->
                <button id="plusBtn" class="w-9 h-9 rounded-full bg-emerald-500 text-white">
                    +
                </button>

                <!-- FILE MENU -->
                <div id="fileMenu" class="absolute bottom-14 left-2 bg-white rounded-xl shadow-lg p-3 w-60 hidden">
                    <input type="file" id="fileInput" class="w-full border rounded mb-2 text-sm" />
                    <button id="sendFileBtn" class="w-full bg-emerald-500 text-white py-2 rounded">
                        Send File
                    </button>
                </div>

                <!-- EMOJI -->
                <button id="emojiBtn" class="w-9 h-9 rounded-full bg-emerald-500 text-white hidden sm:block">
                    😊
                </button>

                <div id="emojiPickerWrapper" class="absolute bottom-14 left-12 hidden z-50">
                    <emoji-picker id="emojiPicker"></emoji-picker>
                </div>

                <!-- MESSAGE -->
                <input id="message" type="text" placeholder="Type a message..."
                    class="flex-1 px-4 py-2 border rounded-full focus:ring-2 focus:ring-emerald-500" />

                <!-- SEND -->
                <button id="btnsend" class="w-9 h-9 rounded-full bg-emerald-500 text-white">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </div>

        <!-- USERS SIDEBAR (DESKTOP) -->
        <aside class="hidden md:flex w-72 bg-white border-l flex-col shadow">
            <h2 class="p-4 text-lg font-semibold border-b">
                Connected Users
            </h2>
            <ul id="users" class="flex-1 overflow-y-auto divide-y"></ul>

            <div class="p-3 flex gap-2">
                <button onclick="rename()" class="flex-1 bg-emerald-500 text-white py-2 rounded">
                    Rename
                </button>
                <button onclick="exitChat()" class="flex-1 bg-gray-500 text-white py-2 rounded">
                    Exit
                </button>
            </div>
        </aside>

        <!-- MOBILE USERS MENU -->
        <div id="mobileUsers" class="fixed inset-0 bg-black/40 hidden z-50">

            <div class="absolute left-0 top-0 w-72 h-full bg-white shadow flex flex-col">
                <h2 class="p-4 text-lg font-semibold border-b flex justify-between">
                    Users
                    <button onclick="toggleUsers()">
                        ✕
                    </button>
                </h2>
                <ul id="usersMobile" class="flex-1 overflow-y-auto divide-y"></ul>

                <div class="p-3 flex gap-2">
                    <button onclick="rename()" class="flex-1 bg-emerald-500 text-white py-2 rounded">
                        Rename
                    </button>
                    <button onclick="exitChat()" class="flex-1 bg-gray-500 text-white py-2 rounded">
                        Exit
                    </button>
                </div>
            </div>
        </div>

    </div>

    <!-- SCRIPT -->
    <script>
        const socket = io();

        const chatbox = document.getElementById("chatbox");
        const users = document.getElementById("users");
        const usersMobile = document.getElementById("usersMobile");
        const menuBtn = document.getElementById("menuBtn");
        const mobileUsers = document.getElementById("mobileUsers");

        const message = document.getElementById("message");
        const emojiBtn = document.getElementById("emojiBtn");
        const emojiPickerWrapper = document.getElementById("emojiPickerWrapper");
        const emojiPicker = document.getElementById("emojiPicker");

        const plusBtn = document.getElementById("plusBtn");
        const fileMenu = document.getElementById("fileMenu");
        const fileInput = document.getElementById("fileInput");
        const sendFileBtn = document.getElementById("sendFileBtn");

        let name = localStorage.getItem("chat-username");
        if (!name) {
            name = prompt("Enter your name").trim();
            localStorage.setItem("chat-username", name);
        }

        socket.emit("name", name);

        menuBtn.onclick = toggleUsers;
        function toggleUsers() {
            mobileUsers.classList.toggle("hidden");
        }

        plusBtn.onclick = () => fileMenu.classList.toggle("hidden");

        emojiBtn.onclick = () =>
            emojiPickerWrapper.classList.toggle("hidden");

        emojiPicker.addEventListener("emoji-click", e => {
            message.value += e.detail.unicode;
            emojiPickerWrapper.classList.add("hidden");
        });

        function appendMessage(text, type) {
            const div = document.createElement("div");
            div.className =
                type === "outgoing"
                    ? "bg-emerald-500 text-white ml-auto max-w-[75%] rounded-xl p-3 shadow"
                    : "bg-white text-gray-800 max-w-[75%] rounded-xl p-3 shadow";

            div.innerHTML = text;
            chatbox.appendChild(div);
            chatbox.scrollTop = chatbox.scrollHeight;
        }

        document.getElementById("btnsend").onclick = () => {
            if (!message.value.trim()) return;
            socket.emit("msg", message.value);
            appendMessage("You: " + message.value, "outgoing");
            message.value = "";
        };

        socket.on("incoming", (data) => {
            if (data.type === "text") {
                appendMessage(`${data.name}: ${data.message}`, "incoming");
            }

            if (data.type === "file") {
                appendMessage(
                    `<b>${data.name}:</b><br>
             <img src="${data.fileContent}" class="rounded max-w-[200px]">`,
                    "incoming"
                );
            }
        });

        socket.on("updateUsers", list => {
            users.innerHTML = "";
            usersMobile.innerHTML = "";
            list.forEach(u => {
                const li1 = document.createElement("li");
                const li2 = document.createElement("li");
                li1.className = li2.className = "px-4 py-3";
                li1.innerText = li2.innerText = u;
                users.appendChild(li1);
                usersMobile.appendChild(li2);
            });
        });

        sendFileBtn.onclick = () => {
            const file = fileInput.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = e => {
                socket.emit("file", {
                    sender: name,
                    fileName: file.name,
                    fileContent: e.target.result
                });
                appendMessage(
                    `<b>You:</b><br><img src="${e.target.result}" class="rounded max-w-[200px]">`,
                    "outgoing"
                );
            };
            reader.readAsDataURL(file);
        };

        function rename() {
            const n = prompt("Enter new name");
            if (n) localStorage.setItem("chat-username", n);
        }

        function exitChat() {
            location.href = "https://google.com";
        }
    </script>
</body>

</html>
